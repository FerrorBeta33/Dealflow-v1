worker_processes auto;
pid /tmp/dealerflow-nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 5m;
    client_body_temp_path /tmp/dealerflow-client-body;
    proxy_temp_path /tmp/dealerflow-proxy;
    fastcgi_temp_path /tmp/dealerflow-fastcgi;
    uwsgi_temp_path /tmp/dealerflow-uwsgi;
    scgi_temp_path /tmp/dealerflow-scgi;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /app/apps/web/dist;
        index index.html;
        add_header Content-Security-Policy "frame-ancestors 'self' https://revolte.ai https://*.revolte.ai" always;
        add_header X-Content-Type-Options nosniff always;

        location = /health {
            proxy_pass http://127.0.0.1:4174/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }
        # Preserve the existing /api prefix; browser requests stay same-origin.
        location /api/ {
            proxy_pass http://127.0.0.1:4174;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /api {
            return 308 /api/;
        }
        # The only frontend is also mounted at /, so assets use their existing base.
        location /web/ {
            rewrite ^/web/(.*)$ /$1 last;
        }
        location ~ /\. {
            deny all;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
