[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/dealerflow-supervisord.pid
childlogdir=/tmp

[program:api]
directory=/app
command=node apps/api/server.js
environment=API_PORT="4174"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Static frontend files are served directly by nginx, not a Vite dev server.
[program:nginx]
command=nginx -c /etc/nginx/dealerflow.conf -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
